[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ghosttrace"
version = "1.0.0"
description = "Semi-automated Memory Forensics Tool for Fileless Malware Detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GhostTrace Research" }]
keywords = ["forensics", "memory", "malware", "volatility", "fileless"]

dependencies = [
    "openai>=1.30.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "weasyprint>=61.2",
    "reportlab>=4.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
ghosttrace = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "tools*", "reporting*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
